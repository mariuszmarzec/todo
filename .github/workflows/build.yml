name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          environment=m
          prod.apiUrl=http://localhost/
          prod.authHeader=Authorization
          test.apiUrl=http://localhost/test
          test.authHeader=Authorization-Test
          storeFile=dummy.keystore
          keyAlias=dummy
          storePassword=dummy
          keyPassword=dummy
          EOF

      - name: Install Android SDK platform 37
        run: |
          echo "Installing Android SDK platform 37 and AGP 9.1 build-tools..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Assemble Android and verify HTTP dependency graph
        run: |
          export JDK_17="$JAVA_HOME"
          ./gradlew :app:assembleDebug
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath | tee /tmp/app-runtime-dependencies.txt
          grep -Fq 'com.squareup.okhttp3:okhttp:5.5.0' /tmp/app-runtime-dependencies.txt
          grep -Fq 'com.squareup.okhttp3:logging-interceptor:5.5.0' /tmp/app-runtime-dependencies.txt
          grep -Fq 'com.squareup.okio:okio:3.18.2' /tmp/app-runtime-dependencies.txt
          if grep -Eq 'com.squareup.okhttp3:okhttp:5\\.3\\.0$|com.squareup.okio:okio:3\\.12\\.0
            echo "Unexpected OkHttp/Okio downgrade found in the Android runtime graph"
            exit 1
          fi
      - name: Unit tests
        run: |
          export JDK_17="$JAVA_HOME"
          ./gradlew :app:testDebugUnitTest :multiplatformUtils:desktopTest :common:desktopTest :desktop:jvmTest

      - name: Upload artifact on tests failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Unit test report
          path: '**/build/reports/tests/**'
 /tmp/app-runtime-dependencies.txt; then
            echo "Unexpected OkHttp/Okio downgrade found in the Android runtime graph"
            exit 1
          fi
      - name: Unit tests
        run: |
          export JDK_17="$JAVA_HOME"
          ./gradlew :app:testDebugUnitTest :multiplatformUtils:desktopTest :common:desktopTest :desktop:jvmTest

      - name: Upload artifact on tests failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Unit test report
          path: '**/build/reports/tests/**'
